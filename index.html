<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Официальное приложение болельщика ФК «Атлант»: матчи, таблица, состав, новости, билеты.">
<title>ФК «Атлант» — приложение болельщика</title>
<meta name="theme-color" content="#0A0D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Атлант">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="crest" id="crest" aria-hidden="true">А</div>
    <div class="topbar__titles">
      <div class="topbar__name" id="clubName">ФК «Атлант»</div>
      <div class="topbar__sub" id="clubSub">Москва · Вторая лига</div>
    </div>
    <div class="topbar__season" id="season">2026/27</div>
  </header>

  <main class="view" id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Основная навигация">
    <a class="tab" href="#home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span>Главная</span>
    </a>
    <a class="tab" href="#matches" data-tab="matches">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
      <span>Матчи</span>
    </a>
    <a class="tab" href="#table" data-tab="table">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/></svg>
      <span>Таблица</span>
    </a>
    <a class="tab" href="#squad" data-tab="squad">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4.1 3.4-6.4 7.5-6.4s7.5 2.3 7.5 6.4"/></svg>
      <span>Состав</span>
    </a>
    <a class="tab" href="#news" data-tab="news">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M7.5 9.5h6M7.5 13.5h9M7.5 17h5"/></svg>
      <span>Новости</span>
    </a>
  </nav>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
